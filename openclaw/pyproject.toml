[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
  "scripts/acceptance_test.py",
  "scripts/diagnose_apis.py",
  "scripts/test_pipeline_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_strict_optional = false
check_untyped_defs = true
exclude = ["^tests/", "^scripts/acceptance_test.py$", "^scripts/diagnose_apis.py$", "^scripts/test_pipeline_.*\\.py$"]
explicit_package_bases = true
